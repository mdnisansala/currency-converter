<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>World Currency Converter</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="card">

    <h2>🌍 World Currency Converter</h2>

    <form method="POST">

        <input type="number"
               name="amount"
               placeholder="Enter Amount"
               required
               value="{{ amount }}">

        <!-- FROM -->
        <select name="from_currency" id="from">

            {% for code, name in currencies.items() %}
            <option value="{{code}}" {% if code == from_currency %}selected{% endif %}>
                {{code}} - {{name}}
            </option>
            {% endfor %}

        </select>

        <!-- SWAP -->
        <button type="button" class="swap-btn" onclick="swapCurrencies()">⇄ Swap</button>

        <!-- TO -->
        <select name="to_currency" id="to">

            {% for code, name in currencies.items() %}
            <option value="{{code}}" {% if code == to_currency %}selected{% endif %}>
                {{code}} - {{name}}
            </option>
            {% endfor %}

        </select>

        <button type="submit" class="convert-btn">Convert</button>

    </form>

    {% if result %}
    <div class="result">
        <h3>{{ amount }} {{ from_currency }} =</h3>
        <h2>{{ "%.2f"|format(result) }} {{ to_currency }}</h2>
    </div>
    {% endif %}

</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
